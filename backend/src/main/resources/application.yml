# Shared settings. Profile files (dev, test, prod) override these.
# Secrets are never written here: they come from environment variables, or from a .env file
# (KEY=value lines) in the backend or repository root, imported below.

spring:
  application:
    name: bank-management-system
  profiles:
    default: dev
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # See TransferService: after taking a row lock we must read the latest committed ledger rows.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
  data:
    web:
      pageable:
        max-page-size: 100
  task:
    execution:
      pool:
        core-size: 2
        max-size: 8
      thread-name-prefix: async-

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      enabled: false   # email is best-effort (sent after commit); an SMTP outage must not mark the API down
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
  default-produces-media-type: application/json

info:
  app:
    name: Bank Management System
    version: 1.0.0

app:
  bank:
    name: ${BANK_NAME:Kosh Bank}
    ifsc-prefix: KOSH
    timezone: Asia/Kolkata
    currency: INR
  security:
    bcrypt-strength: 12
    jwt:
      secret: ${JWT_SECRET}
      issuer: bank-management-system
      access-token-ttl: 15m
      refresh-token-ttl: 7d
    refresh-cookie:
      name: bms_refresh
      path: /api/v1/auth
      secure: ${COOKIE_SECURE:true}
      same-site: Strict
    lockout:
      max-failed-attempts: 5
      duration: 15m
    password-reset:
      otp-ttl: 10m
      max-attempts: 5
  rate-limit:
    auth-capacity: 10
    auth-refill-period: 1m
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  transfer:
    beneficiary-cooling-period: ${BENEFICIARY_COOLING_PERIOD:30m}
    idempotency-ttl: 24h
  mail:
    enabled: ${MAIL_ENABLED:true}
    from: ${MAIL_FROM:no-reply@koshbank.test}
  scheduling:
    enabled: true
    interest-cron: "0 30 1 1 * *"      # 01:30 on the 1st of every month
    fd-maturity-cron: "0 15 0 * * *"   # 00:15 daily
    emi-debit-cron: "0 0 6 * * *"      # 06:00 daily
    housekeeping-cron: "0 0 * * * *"   # hourly
  bootstrap:
    admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    admin-name: ${BOOTSTRAP_ADMIN_NAME:}
