# Public demo, layered on prod: SPRING_PROFILES_ACTIVE=prod,demo.
# Keeps prod's security settings (secure cookie, no secret defaults, trusted-proxy handling) and adds
# the demo seed, reloaded on every start (see DemoResetConfig), sized for a free 512 MB instance.

spring:
  datasource:
    # Managed MySQL (e.g. Aiven) needs TLS. Give either DB_URL, or DB_HOST + DB_PORT (+ DB_NAME).
    url: ${DB_URL:jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:defaultdb}?sslMode=REQUIRED&serverTimezone=UTC}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    clean-disabled: false

server:
  port: ${PORT:8080}   # Render (and most PaaS) tell the app which port to bind
  tomcat:
    threads:
      max: 40

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:}   # plain text reads better in the host's log viewer; set ecs for JSON

app:
  demo:
    reset-on-startup: ${DEMO_RESET_ON_STARTUP:true}
  mail:
    enabled: ${MAIL_ENABLED:false}   # free hosts block outbound SMTP; notifications stay in-app
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://kosh-bank.vercel.app}
